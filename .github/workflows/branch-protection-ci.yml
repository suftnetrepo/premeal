name: Branch protection and CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - "**"
  merge_group:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  enforce-branch-policy:
    name: Enforce branch policy
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Block direct pushes to main
        run: |
          echo "Direct pushes to main are blocked."
          echo "Create a feature branch, open a pull request, and wait for CI to pass before merging."
          exit 1

  ci:
    name: CI pipeline
    runs-on: ubuntu-latest
    if: github.event_name != 'push' || github.ref != 'refs/heads/main'
    timeout-minutes: 20

    # `npm run build` runs `prisma migrate deploy`, so the build needs a
    # database. Give it a throwaway Postgres (same major version as
    # production on Neon) rather than any real database's credentials —
    # this job runs on unreviewed PR code, which must never migrate
    # production. Side benefit: every PR proves all migrations apply
    # cleanly to an empty database.
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
      DIRECT_URL: postgresql://ci:ci@localhost:5432/ci

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint

      - name: Run production build
        run: npm run build

# GitHub branch protection settings needed in the repo:
# - Require a pull request before merging for main
# - Require status checks to pass before merging
# - Require the "CI pipeline" job to pass
# - Optionally require branches to be up to date before merging
# - Optionally require conversation resolution before merge
